[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofmesh"
version = "0.1.0"
description = "Evidence-first dynamic multi-agent orchestration service with MCP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "mcp>=1.9,<2",
  "pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "sqlalchemy>=2.0,<3",
  "aiosqlite>=0.20", "greenlet>=3.0", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6"]
postgres = ["asyncpg>=0.29"]

[project.scripts]
proofmesh = "proofmesh.app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["proofmesh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
